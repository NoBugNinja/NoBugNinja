<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="100%" height="auto" style="max-width: 440px; font-family: -apple-system, BlinkMacSystemFont, Consolas, 'Segoe UI', monospace;">
  <defs>
